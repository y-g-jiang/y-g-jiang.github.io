<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ColorChecker Classic · 24 patches + blue band</title>
<style>
  :root {
    --bg: #262626;
    --ink: #ececec;
    --dim: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    /* chart height in units of 100 px: 5 rows with the band, else 4 */
    --hh: 21.2;
    --s: min(calc(94vw / 23.1), calc(88vh / var(--hh)));
    background: var(--bg);
    color: var(--ink);
    font: 400 clamp(11px, calc(.24 * var(--s)), 15px)/1.45
          -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body:not(.extended) { --hh: 15.9; }

  .chart {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    width: calc(23.1 * var(--s));
    height: calc(var(--hh) * var(--s));
    padding: calc(.9 * var(--s));
    gap: calc(.3 * var(--s));
    background: #000;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .07),
                0 2.4rem 5rem -1.5rem rgb(0 0 0 / .85);
  }
  #chart-24 { grid-template-rows: repeat(4, 1fr); }
  #chart-band { grid-template-rows: 3.3fr 3.3fr 5fr 3.3fr 3.3fr; }
  body.extended #chart-24,
  body:not(.extended) #chart-band { display: none; }

  .patch {
    position: relative;
    background: var(--c);
    outline: 0 solid #fff;
    outline-offset: 0;
    transition: outline-width .1s ease, outline-offset .1s ease;
  }
  .patch:hover,
  .patch:focus-visible {
    outline-width: calc(.055 * var(--s));
    outline-offset: calc(.045 * var(--s));
    z-index: 2;
  }

  .band {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: calc(.08 * var(--s));
    min-height: 0;
  }
  .band i {
    flex: 1 1 0;
    min-width: 0;
    background: var(--c);
  }

  /* optional patch numbers */
  .numbers .patch::after {
    content: attr(data-n);
    position: absolute;
    top: calc(.12 * var(--s));
    left: calc(.12 * var(--s));
    padding: .06em .38em;
    border-radius: .28em;
    background: rgb(0 0 0 / .58);
    color: #fff;
    font: 600 clamp(8px, calc(.155 * var(--s)), 11px)/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }

  .hud {
    position: fixed;
    left: 50%;
    bottom: clamp(8px, 1.6vh, 16px);
    transform: translate(-50%, .4rem);
    display: flex;
    align-items: center;
    gap: .85em;
    padding: .5em .9em .5em .6em;
    border-radius: 999px;
    background: rgb(18 18 18 / .82);
    border: 1px solid rgb(255 255 255 / .1);
    box-shadow: 0 1rem 2.4rem -1rem rgb(0 0 0 / .9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: clamp(11px, calc(.23 * var(--s)), 14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    white-space: nowrap;
  }
  body.inspecting .hud { opacity: 1; transform: translate(-50%, 0); }

  .hud .swatch {
    width: 1.5em;
    height: 1.5em;
    border-radius: .32em;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22);
  }
  .hud .code {
    color: var(--dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .95em;
  }
  .hud .note {
    padding-left: .7em;
    border-left: 1px solid rgb(255 255 255 / .14);
    color: #b9b9b9;
    font-size: .92em;
  }
  .hud .note:empty { display: none; }
  .hud.copied .code { color: #8ee6a8; }

  .hint {
    position: fixed;
    top: clamp(10px, 2.2vh, 24px);
    left: 50%;
    transform: translateX(-50%);
    color: var(--dim);
    font-size: clamp(10px, calc(.19 * var(--s)), 12px);
    letter-spacing: .02em;
    opacity: 0;
    animation: hint 9s ease forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes hint {
    0% { opacity: 0; }
    7%, 74% { opacity: .85; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .patch, .hud { transition: none; }
    .hint { animation: none; opacity: .7; }
  }
</style>

  <span class="swatch" id="hud-swatch"></span>

  <span class="note" id="hud-note"></span>
</div>

<div class="hint">hover a patch &middot; click to copy &middot; N numbers &middot; B blue band &middot; F fullscreen</div>

<script>
const hud = document.getElementById('hud');
const hudSwatch = document.getElementById('hud-swatch');
const hudName = document.getElementById('hud-name');
const hudCode = document.getElementById('hud-code');
const hudNote = document.getElementById('hud-note');

let flashTimer = 0;

const describe = cell => {
  const [r, g, b] = cell.dataset.rgb.split(' ');
  hudSwatch.style.background = `rgb(${r} ${g} ${b})`;
  hudName.textContent = cell.dataset.name;
  hudCode.textContent = `${cell.dataset.hex}   ${r} ${g} ${b}`;
  hudNote.textContent = cell.dataset.note || '';
  document.body.classList.add('inspecting');
};

const hide = () => {
  document.body.classList.remove('inspecting');
  hud.classList.remove('copied');
};

const glow = text => {
  hud.classList.add('copied');
  hudCode.textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => hud.classList.remove('copied'), 1100);
};

for (const cell of document.querySelectorAll('.patch')) {
  cell.addEventListener('pointerenter', () => describe(cell));
  cell.addEventListener('focus', () => describe(cell));
  cell.addEventListener('pointerleave', hide);
  cell.addEventListener('blur', hide);

  cell.addEventListener('click', async () => {
    const value = cell.dataset.hex;
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const t = document.createElement('textarea');
      t.value = value;
      t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    describe(cell);
    glow(`copied ${value}`);
  });
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { hide(); document.body.classList.toggle('extended'); }
  if (k === 'n') { document.body.classList.toggle('numbers'); }
  if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});
</script>
